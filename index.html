<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jashan's Tracker">
<title>Jashan's Life Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0a192f;--bg2:#112240;--bg3:#1d3557;
  --accent:#64ffda;--text:#e2e8f0;--sub:#8892b0;
  --card:rgba(255,255,255,0.03);--card2:rgba(255,255,255,0.05);
  --border:rgba(100,255,218,0.08);--inputBg:rgba(255,255,255,0.04);
  --green:#10b981;--purple:#8b5cf6;--amber:#f59e0b;--red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3));min-height:100vh;min-height:100dvh;padding-bottom:90px;-webkit-font-smoothing:antialiased}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.fu{animation:fu .4s ease forwards}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(0.3);opacity:0}}
@keyframes shimmer{0%{opacity:0.6}50%{opacity:1}100%{opacity:0.6}}
.ctr{max-width:680px;margin:0 auto;padding:0 16px}
/* HEADER */
.hdr{padding:24px 0 6px}
.hdr-top{display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-family:'Outfit';font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--accent),#64ffda88,#e2e8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .s{font-size:11px;color:var(--sub);font-weight:600;margin-top:2px}
.today-badge{font-size:10px;background:rgba(100,255,218,0.1);color:var(--accent);padding:4px 10px;border-radius:8px;font-weight:700;border:1px solid rgba(100,255,218,0.2)}
/* INTENTION */
.intention-banner{background:linear-gradient(135deg,rgba(100,255,218,0.07),rgba(100,255,218,0.02));border:1px solid rgba(100,255,218,0.15);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.intention-label{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.intention-input{width:100%;background:transparent;border:none;outline:none;font-size:14px;font-weight:700;color:var(--accent);font-family:'Nunito';font-style:italic}
.intention-input::placeholder{color:var(--sub);font-style:italic;font-weight:600}
.intention-hint{font-size:10px;color:var(--sub);margin-top:4px}
/* TABS */
.tabs{display:flex;gap:6px;padding:12px 0 16px}
.tab{flex:1;padding:9px 6px;border:1px solid var(--border);border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Nunito';background:var(--card);color:var(--sub);transition:all .25s;text-align:center}
.tab:hover{transform:translateY(-1px)}
.tab.a{background:var(--accent);color:#0a192f;border-color:transparent;font-weight:800}
/* SCORE CARD */
.sm{padding:18px;background:linear-gradient(135deg,rgba(100,255,218,0.06),rgba(100,255,218,0.02));border:1px solid rgba(100,255,218,0.12);border-radius:16px;margin-bottom:14px}
.sm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sm .lb{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.sm .bg{font-size:30px;font-family:'Outfit';font-weight:900}
.sm .bg span{font-size:15px;color:var(--sub)}
.stk{font-size:12px;margin-top:4px;font-weight:700;color:var(--amber)}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center}
.stat-box .sv{font-size:17px;font-weight:900;font-family:'Outfit'}
.stat-box .sl{font-size:9px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.stat-box .si{font-size:13px;margin-bottom:2px}
.cd{display:flex;gap:9px;margin-top:5px}
.cd .d{width:6px;height:6px;border-radius:50%;display:inline-block}
.cd span{font-size:10px;color:var(--sub);font-weight:600}
/* TRACKER — TODAY VIEW */
.cc{margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ch{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.ch h2{font-size:15px;font-weight:800;font-family:'Outfit';display:flex;align-items:center;gap:6px}
.ch .m{font-size:10px;color:var(--sub);font-weight:600;margin-top:1px}
.ch .p{font-size:17px;font-weight:900;font-family:'Outfit'}
.ch .ps{font-size:9px;color:var(--sub)}
.bw{padding:0 16px 2px}
/* TODAY CHECKLIST */
.today-list{padding:10px 16px 14px;display:flex;flex-direction:column;gap:6px}
.habit-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--inputBg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;-webkit-user-select:none;user-select:none}
.habit-row:hover{background:rgba(255,255,255,0.06)}
.habit-row.done{background:rgba(100,255,218,0.04);border-color:rgba(100,255,218,0.15)}
.habit-check{width:24px;height:24px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.habit-check.on{border-color:transparent;animation:checkPop .3s ease}
.habit-name{font-size:13px;font-weight:600;flex:1;transition:all .2s}
.habit-name.done{color:var(--sub);text-decoration:line-through}
.habit-streak{font-size:10px;font-weight:700}
/* WEEK TOGGLE */
.week-toggle{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px 12px;cursor:pointer;color:var(--sub);font-size:11px;font-weight:700;transition:color .2s}
.week-toggle:hover{color:var(--accent)}
.week-toggle .arr{transition:transform .3s;display:inline-block}
.week-toggle .arr.open{transform:rotate(180deg)}
/* WEEK GRID */
.week-grid-wrap{padding:0 16px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;display:none}
.week-grid-wrap.open{display:block}
table{width:100%;border-collapse:separate;border-spacing:3px}
th{font-size:9px;color:var(--sub);font-weight:700;padding:2px 1px;text-align:center}
th:first-child{text-align:left;padding-left:5px;min-width:110px}
td.tn{font-size:11px;font-weight:600;padding:4px 5px}
.ck{width:26px;height:26px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;transition:all .15s;border:2px solid var(--border);background:var(--inputBg)}
.ck:hover{transform:scale(1.1)}
.ck.on{border-color:transparent;animation:checkPop .3s ease}
/* SUMMARY */
.sum{margin-bottom:14px;padding:16px;background:linear-gradient(135deg,rgba(100,255,218,0.04),var(--card));border:1px solid var(--border);border-radius:14px}
.sum h3{font-size:14px;font-weight:800;font-family:'Outfit';margin-bottom:12px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--card);border-radius:9px;margin-bottom:8px}
.srow .n{font-size:12px;font-weight:700}
.srow .bd{font-size:10px;padding:2px 7px;border-radius:14px;font-weight:700}
.sts span{font-size:20px;cursor:pointer;opacity:.23;transition:all .2s;display:inline-block}
.sts span.on{opacity:1}
.sl{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:5px;margin-top:10px}
.inp{width:100%;background:var(--inputBg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'Nunito';outline:none}
.inp:focus{border-color:rgba(100,255,218,0.3)}
.inp::placeholder{color:var(--sub)}
textarea.inp{resize:vertical;min-height:65px}
/* DAILY LOG */
.daycard{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.daycard-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background .2s}
.daycard-head:hover{background:rgba(100,255,218,0.03)}
.daycard-left{display:flex;align-items:center;gap:10px}
.daycard-day{font-size:14px;font-weight:800;font-family:'Outfit'}
.daycard-date{font-size:11px;color:var(--sub);font-weight:600}
.daycard-preview{display:flex;align-items:center;gap:8px}
.daycard-preview .mood-prev{font-size:18px}
.daycard-preview .ep{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.daycard-preview .arrow{font-size:12px;color:var(--sub);transition:transform .3s;display:inline-block}
.daycard-preview .arrow.open{transform:rotate(180deg)}
.daycard-body{padding:0 16px;max-height:0;opacity:0;overflow:hidden;transition:max-height .6s ease,opacity .3s ease,padding .3s ease}
.daycard-body.open{max-height:2600px;opacity:1;padding-bottom:16px}
.daycard-field{margin-bottom:14px}
.daycard-field label{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;display:block}
.mood-row{display:flex;gap:6px;flex-wrap:wrap}
.mood-btn{font-size:22px;cursor:pointer;opacity:.25;transition:all .15s;padding:4px;border-radius:8px;display:inline-block}
.mood-btn.a{opacity:1;transform:scale(1.15);background:rgba(100,255,218,0.08)}
.mood-btn:hover{opacity:.6}
.energy-row{display:flex;gap:6px}
.eng-num{width:40px;height:40px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:transparent;color:var(--sub);font-family:'Outfit';transition:all .2s;display:flex;align-items:center;justify-content:center}
.eng-num:hover{border-color:var(--accent);transform:scale(1.05)}
.eng-num.a{border-color:var(--accent);background:rgba(100,255,218,0.12);color:var(--accent);animation:popIn .3s ease}
.stress-row{display:flex;align-items:center;gap:10px}
.stress-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer}
.stress-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg2)}
.stress-label{font-size:13px;font-weight:800;min-width:24px;text-align:center}
.workout-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.workout-type-btn{padding:8px 6px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--inputBg);color:var(--sub);font-family:'Nunito';transition:all .2s;text-align:center}
.workout-type-btn.a{border-color:var(--green);background:rgba(16,185,129,0.12);color:var(--green)}
.dur-input{width:100%;background:var(--inputBg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;font-weight:800;font-family:'Outfit';outline:none;transition:border-color .2s}
.dur-input:focus{border-color:rgba(16,185,129,0.4)}
.dur-input::placeholder{color:var(--sub);font-weight:600;font-size:13px}
.meal-inp{width:100%;background:var(--inputBg);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text);font-size:12px;font-family:'Nunito';outline:none;transition:border-color .2s;margin-bottom:6px}
.meal-inp:focus{border-color:rgba(16,185,129,0.3)}
.meal-inp::placeholder{color:var(--sub)}
.sleep-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.time-inp{width:100%;background:var(--inputBg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;font-weight:800;font-family:'Outfit';outline:none;transition:border-color .2s}
.time-inp:focus{border-color:rgba(100,255,218,0.3)}
.sleep-calc{font-size:11px;color:var(--accent);font-weight:700;margin-top:5px}
.quick-journal{display:flex;flex-direction:column;gap:6px}
.qj-row{display:flex;align-items:flex-start;gap:8px;background:var(--inputBg);border:1px solid var(--border);border-radius:9px;padding:8px 12px}
.qj-emoji{font-size:14px;margin-top:1px;flex-shrink:0}
.qj-inp{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12px;font-family:'Nunito';resize:none;min-height:20px}
.qj-inp::placeholder{color:var(--sub)}
.sec-divider{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;padding-left:4px}
/* INSIGHTS TAB */
.ins-section{margin-bottom:16px}
.ins-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.ins-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.ins-title{font-size:16px;font-weight:800;font-family:'Outfit';margin-bottom:4px}
.ins-date{font-size:11px;color:var(--sub);font-weight:600;margin-bottom:14px}
/* Today snapshot bars */
.cat-feedback-row{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.cat-feedback-row:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.cat-fb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cat-fb-name{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.cat-fb-pct{font-size:13px;font-weight:900;font-family:'Outfit'}
.fb-bar-wrap{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-bottom:6px}
.fb-bar{height:100%;border-radius:3px;transition:width .6s ease}
.fb-line{font-size:12px;color:var(--sub);line-height:1.5;font-weight:600}
.fb-line.good{color:var(--green)}
.fb-line.warn{color:var(--amber)}
.fb-line.bad{color:var(--red)}
/* Motivational line */
.motiv-card{background:linear-gradient(135deg,rgba(100,255,218,0.06),rgba(139,92,246,0.06));border:1px solid rgba(100,255,218,0.12);border-radius:12px;padding:14px 16px;margin-bottom:12px;text-align:center}
.motiv-line{font-size:13px;font-weight:700;color:var(--text);line-height:1.6;font-style:italic}
.motiv-tag{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
/* Pattern cards */
.pattern-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.pattern-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.pattern-box .pv{font-size:16px;font-weight:900;font-family:'Outfit';margin:3px 0}
.pattern-box .pl{font-size:9px;color:var(--sub);font-weight:700;text-transform:uppercase}
.pattern-box .pi{font-size:13px}
.pattern-text{font-size:12px;color:var(--sub);line-height:1.6;font-weight:600;padding:10px 12px;background:var(--inputBg);border-radius:9px;margin-bottom:8px}
/* Verdict */
.verdict-card{background:var(--card2);border-radius:12px;padding:14px;margin-bottom:10px}
.verdict-text{font-size:13px;line-height:1.7;font-weight:600;color:var(--text)}
.verdict-days{display:flex;gap:8px;margin-top:12px}
.verdict-day{flex:1;padding:8px;border-radius:9px;text-align:center}
.verdict-day .vd-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.verdict-day .vd-val{font-size:12px;font-weight:800}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* HISTORY */
.hc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .3s;margin-bottom:10px}
.hc:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.hbs{display:flex;gap:5px;margin-top:8px}
.hbi{flex:1;background:var(--inputBg);border-radius:7px;padding:6px;text-align:center}
.h-mid{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.h-left{display:flex;align-items:center;gap:8px}
.best-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;background:rgba(245,158,11,0.12);color:var(--amber);padding:2px 7px;border-radius:6px;font-weight:800;margin-left:6px}
/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent,var(--bg1) 30%);padding:12px 16px 20px;display:flex;justify-content:center;gap:10px;z-index:100}
.bb{padding:10px 20px;border-radius:11px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito';transition:all .25s;border:1px solid var(--border);background:rgba(10,25,47,0.9);color:var(--sub);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bb:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent)}
/* MODALS */
.mbg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:flex-start;padding:20px;overflow-y:auto}
.mdl{width:100%;max-width:540px;background:var(--bg2);border-radius:18px;border:1px solid var(--border);padding:24px;position:relative}
.mc{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
.mdl h2{font-family:'Outfit';font-size:20px;font-weight:800;margin-bottom:20px}
.ce{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.ceh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.db{width:30px;height:30px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito';border:2px solid var(--border);background:transparent;color:var(--sub)}
.ti{display:flex;align-items:center;gap:5px;padding:4px 7px;border-radius:7px;margin-bottom:2px}
.ti:hover{background:rgba(100,255,218,0.05)}
.ti .nm{flex:1;font-size:12px;font-weight:600}
.ti .tdl{background:none;border:none;color:#ef4444aa;cursor:pointer;font-size:11px;padding:2px}
.ar{display:flex;gap:5px;margin-top:6px}
.svb{width:100%;padding:11px;border-radius:11px;background:var(--accent);border:none;color:#0a192f;font-size:14px;font-weight:800;cursor:pointer;font-family:'Outfit';margin-top:16px}
.clr-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;display:inline-block}
.clr-dot:hover{transform:scale(1.15)}
.clr-dot.a{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,0.3)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0a192f;padding:10px 24px;border-radius:10px;font-weight:700;font-size:13px;font-family:'Nunito';z-index:3000;animation:fu .3s ease}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:2000;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:confettiFall 3s ease-out forwards}
@media(max-width:480px){.hdr h1{font-size:19px}.bb{padding:10px 14px;font-size:11px}.workout-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="ctr" id="app"></div>
<div class="bottom-bar">
  <button class="bb" onclick="sv('history')">📊 History</button>
  <button class="bb" onclick="sS()">⚙️ Settings</button>
</div>
<script>
const D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const M=["😫","😔","😐","🙂","😊","😄","🔥"];
const COLORS=["#10b981","#8b5cf6","#f59e0b","#ef4444","#3b82f6","#ec4899"];
const WORKOUT_TYPES=["🏋️ Gym","🏃 Cardio","🧘 Home","🚶 Walk","😴 Rest Day"];
const STRESS_LABELS=["","😌 Chill","🙂 Okay","😐 Mild","😰 Stressed","🔥 Overwhelmed"];

// MOTIVATIONAL LINES — categorized by situation
const MOTIV={
  lowScore:["Ek din ka miss matlab game over nahi — kal fir shuru karo 💪","Progress slow ho sakta hai, lekin ruk mat. Tum sahi direction mein ho 🔥","Aaj ka effort kal ka result banega. Trust the process, Jashan","Hard days banate hain strong people. Aaj survive kiya — kal thrive karoge","1% better every day. Compounding karta hai — bas mat ruko"],

function getRandMotiv(arr){return arr[Math.floor(Math.random()*arr.length)]}
function getMotivLine(score,streak,sleepHrs,stressAvg){
  if(stressAvg&&stressAvg>=4)return getRandMotiv(MOTIV.stressHigh);

// WEEK UTILS
function wid(dt=new Date()){const d=new Date(dt);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);const wn=1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7);return d.getFullYear()+"-W"+String(wn).padStart(2,"0")}
function wr(w){try{const[y,ws]=w.split("-W");const j=new Date(+y,0,4);const dw=j.getDay()||7;const m=new Date(j);m.setDate(j.getDate()-dw+1+(+ws-1)*7);const s=new Date(m);s.setDate(m.getDate()+6);const f=d=>d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});return f(m)+" — "+f(s)}catch(e){return w}}
function getWeekDates(w){try{const[y,ws]=w.split("-W");const j=new Date(+y,0,4);const dw=j.getDay()||7;const m=new Date(j);m.setDate(j.getDate()-dw+1+(+ws-1)*7);return D.map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"})});}catch(e){return D.map(()=>"")}}
function ew(w){if(!w)return;if(!S.wk[w]){S.wk[w]={};S.cats.forEach(c=>{S.wk[w][c.id]={};c.t.forEach(t=>{S.wk[w][c.id][t]=Array(c.d).fill(false)})})}if(!S.mt[w])S.mt[w]={};if(!S.mt[w].dl)S.mt[w].dl={}}
function getTodayIdx(){const d=new Date().getDay();return d===0?6:d-1}

// SCORING
function gs(wd,cat){if(!wd||!cat)return{dn:0,tl:0,p:0};let dn=0,tl=0;cat.t.forEach(t=>{const a=wd[cat.id]?.[t]||[];for(let i=0;i<cat.d;i++){tl++;if(a[i])dn++}});return{dn,tl,p:tl?Math.round(dn/tl*100):0}}
function go(wd){if(!wd)return{dn:0,tl:0,p:0};let dn=0,tl=0;S.cats.forEach(c=>{const s=gs(wd,c);dn+=s.dn;tl+=s.tl});return{dn,tl,p:tl?Math.round(dn/tl*100):0}}
function gsCat(catId,dayIdx){const wd=S.wk[CW]||{};const cat=S.cats.find(c=>c.id===catId);if(!cat)return{dn:0,tl:0,p:0};let dn=0,tl=0;cat.t.forEach(t=>{tl++;if((wd[catId]?.[t]||[])[dayIdx])dn++;});return{dn,tl,p:tl?Math.round(dn/tl*100):0}}
function stk(){const ws=Object.keys(S.wk).sort().reverse();let s=0;for(const w of ws){if(go(S.wk[w]).p>=50)s++;else break}return s}
function getBestWeek(){const ws=Object.keys(S.wk);let best=null,bp=0;ws.forEach(w=>{const p=go(S.wk[w]).p;if(p>bp){bp=p;best=w}});return{week:best,pct:bp}}

// FULL STREAK
function getTaskStreak(catId,task){
  const sorted=Object.keys(S.wk).sort().reverse();
  const today=getTodayIdx();
  let streak=0;let broken=false;
  for(let wi=0;wi<sorted.length;wi++){
    const w=sorted[wi];const wd=S.wk[w]||{};
    const arr=wd[catId]?.[task]||[];
    const cat=S.cats.find(c=>c.id===catId);if(!cat)break;
    const limit=wi===0?today:cat.d-1;
    for(let di=limit;di>=0;di--){if(arr[di])streak++;else{broken=true;break;}}
    if(broken)break;
  }
  return streak;
}

// SLEEP
function calcSleep(bed,wake){if(!bed||!wake)return null;try{const[bh,bm]=bed.split(":").map(Number);const[wh,wm]=wake.split(":").map(Number);let mins=(wh*60+wm)-(bh*60+bm);if(mins<0)mins+=24*60;return{h:Math.floor(mins/60),m:mins%60,total:mins};}catch(e){return null}}
function fmtSleep(s){if(!s)return null;return s.h+"h"+(s.m>0?" "+s.m+"m":"")}
function avgSleepWeek(){const dl=(S.mt[CW]||{}).dl||{};let total=0,count=0;D.forEach((_,i)=>{const s=calcSleep(dl["bed_"+i],dl["wake_"+i]);if(s){total+=s.total;count++;}});if(!count)return null;const avg=total/count;return{h:Math.floor(avg/60),m:Math.round(avg%60),total:avg}}
function avgStressWeek(){const dl=(S.mt[CW]||{}).dl||{};let total=0,count=0;D.forEach((_,i)=>{const v=dl["stress_"+i];if(v!==undefined&&v!==null){total+=Number(v);count++;}});if(!count)return null;return Math.round(total/count*10)/10}
function avgMoodWeek(){const dl=(S.mt[CW]||{}).dl||{};const mv=D.map((_,i)=>dl["mood_"+i]).filter(v=>v!==undefined);if(!mv.length)return null;return Math.round(mv.reduce((a,b)=>a+b,0)/mv.length)}

// SCORE COLORS
function scoreColor(p){if(p>=75)return"var(--green)";if(p>=50)return"var(--amber)";return"var(--red)"}
function scoreEmoji(p){if(p>=75)return"💚";if(p>=50)return"🟡";return"🔴"}
function stressColor(v){if(!v)return"var(--sub)";if(v<=2)return"var(--green)";if(v<=3)return"var(--amber)";return"var(--red)"}
function sleepColor(h){if(!h)return"var(--sub)";if(h>=7)return"var(--green)";if(h>=6)return"var(--amber)";return"var(--red)"}

// INSIGHTS — Daily feedback text per category
function getDailyFeedback(catId,dayIdx){
  const wd=S.wk[CW]||{};const cat=S.cats.find(c=>c.id===catId);if(!cat)return"";
  const s=gsCat(catId,dayIdx);const dl=(S.mt[CW]||{}).dl||{};

    if(s.p===100)return"Perfect physical day! Khana bhi, movement bhi — yahi consistency hai 🔥";
    if(workout)return`${workout} kiya — great! ${meals<3?"Baaki meals bhi track karo kal.":"Aur khana bhi ghar pe — solid day 💪"}`;
    return s.p>=50?"Acha progress — physical activity add karo kal routine mein":"Khana ghar pe banao + koi bhi movement karo. Simple hai, powerful hai";
  }
  if(catId==="mental"){
    const mood=dl["mood_"+dayIdx];const stress=dl["stress_"+dayIdx];
    if(s.p===0)return"Mental habits aaj zero rahi. Kal sirf ek karo — journal likho ya bahar niklo 🧘";
    if(s.p===100)return"Mental health pe poora focus aaj — family, exploration, journal sab. Proud 💜";
    if(stress>=4)return"Stress high raha aaj. Normal hai. Journal mein likho kya chal raha hai — halka feel hoga";
    if(mood!==undefined&&mood<=2)return"Mood thoda low raha. Theek hai — kisi se baat karo ya bahar niklo, fark padta hai";
    return s.p>=50?"Good mental day — consistency banao":"Kal kisi se baat karo ya 10 min bahar jao. Chhoti cheezein badi hoti hain";
  }
  if(catId==="financial"){
    if(s.p===0)return"Financial habits aaj complete nahi hui. Kal kaam pe focus karo 💰";
    if(s.p===100)return"Financial discipline solid raha aaj — kaam gaye, log kiya, career pe bhi kuch kiya 🏆";
    return s.p>=66?"Good — kal career action step zaroor karo":"Shift log karna mat bhoolna — data se patterns milte hain";
  }
  return"";
}

// INSIGHTS — Weekly pattern text
function getWeeklyPatternText(){
  const dl=(S.mt[CW]||{}).dl||{};const today=getTodayIdx();
  let patterns=[];
  // Sleep-mood correlation
  let sleepLowMoodLow=0,sleepHighMoodHigh=0,bothCount=0;
  for(let i=0;i<=today;i++){
    const s=calcSleep(dl["bed_"+i],dl["wake_"+i]);
    const mood=dl["mood_"+i];
    if(s&&mood!==undefined){
      bothCount++;
      if(s.h<6&&mood<=2)sleepLowMoodLow++;
      if(s.h>=7&&mood>=4)sleepHighMoodHigh++;
    }
  }
  if(bothCount>=3){
    if(sleepLowMoodLow>=2)patterns.push("Jab neend kam rahi, mood bhi neeche gaya — yeh pattern clear dikh raha hai. Neend fix karo 😴");
    else if(sleepHighMoodHigh>=2)patterns.push("Jab 7+ ghante soye, mood consistently achi rahi — neend ka fark real hai ✅");
  }
  // Stress pattern
  const avgSt=avgStressWeek();
  if(avgSt&&avgSt>=3.5)patterns.push("Is hafte stress consistently high raha. Journal mein likho kya trigger kar raha hai 🧠");
  else if(avgSt&&avgSt<=2)patterns.push("Stress levels low raha is hafte — mental state strong hai 💚");
  // Physical consistency
  const phyCat=S.cats.find(c=>c.id==="physical");if(phyCat){const s=gs(S.wk[CW]||{},phyCat);if(s.p<40)patterns.push("Physical habits is hafte weak rahi — sirf ek habit daily pakad lo, baaki follow karegi 💪");else if(s.p>=75)patterns.push("Physical consistency is hafte solid rahi — body ko fark pad raha hoga 🔥");}
  if(!patterns.length)patterns.push("Abhi zyada data nahi hai patterns dikhne ke liye — daily log bharte raho, patterns emerge honge");
  return patterns;
}

  else if(ov.p>=80)verdict=`Jashan, yeh hafte ka ek strong performance raha — ${ov.p}% overall. ${best.e} ${best.l} pe especially achi consistency rahi. ${sk>1?`${sk} week ki streak bana li — mat todna.`:""} Ek cheez next week: ${worst.l} pe thoda zyada focus.`;
  else if(ov.p>=50)verdict=`Decent week Jashan — ${ov.p}% overall. ${best.e} ${best.l} strong raha. ${worst.e} ${worst.l} pe scope hai improve karne ka. ${today<4?"Abhi week khatam nahi hua — push karo":"Kal se naya week, naye goals."} `;
  else verdict=`Is hafte ${ov.p}% raha — honestly, improve karna hai. ${best.e} ${best.l} mein kuch effort dikha. ${worst.e} ${worst.l} pe next week concentrate karo. Slow progress bhi progress hai Jashan.`;
  // Best/worst day
  let bestDay={idx:-1,p:0},worstDay={idx:-1,p:101};
  for(let i=0;i<=today;i++){
    let dn=0,tl=0;
    S.cats.forEach(c=>{c.t.forEach(t=>{tl++;if((wd[c.id]?.[t]||[])[i])dn++;});});

    if(p>bestDay.p){bestDay={idx:i,p};}
    if(p<worstDay.p){worstDay={idx:i,p};}

// RENDER HELPERS
function csv(p,cl,sz=80){const sw=6,r=(sz-sw)/2,c=2*Math.PI*r,o=c-(p/100)*c;return`<div style="position:relative;width:${sz}px;height:${sz}px;display:inline-block"><svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${cl}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${o}" stroke-linecap="round" style="transition:stroke-dashoffset .5s"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${sz*.22}px;font-weight:800;color:#e2e8f0;font-family:'Outfit'">${p}%</div></div>`}
function bh(p,cl,h=7){return`<div style="width:100%;background:rgba(255,255,255,0.06);border-radius:${h}px;height:${h}px;overflow:hidden"><div style="width:${p}%;height:100%;background:${cl};border-radius:${h}px;transition:width .6s"></div></div>`}
function cksvg(col="#fff"){return`<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

      const s=gs(wd,cat);

    <input class="inp" placeholder="One priority for next week..." value="${esc(mt.focus)}" onblur="sm('focus',this.value)" ${ic?"":"disabled"}></div>`;
  }

  // ══════ DAILY LOG TAB ══════
  if(S.v==="dailylog"){
    D.forEach((day,i)=>{
      const isOpen=!!openDays[i];
      const isToday=i===today;
      const dm=dl["mood_"+i],de=dl["energy_"+i],dst=dl["stress_"+i];
      const dwk=dl["workout_"+i],ddur=dl["duration_"+i];

          <div class="daycard-left">
            <span class="daycard-day" style="${isToday?"color:var(--accent)":""}">${day}</span>

          </div>

            <span class="daycard-date">${dateStr}</span>

            </div>
            ${sl?`<div class="sleep-calc">😴 ${fmtSleep(sl)} sleep ${sl.h>=7?"✅ Great!":sl.h>=6?"⚡ Okay":"😰 Need more rest"}</div>`:""}
          </div>
          <div class="sec-divider">💪 Workout</div>
          <div class="daycard-field">
            <label>Workout Type</label>
            <div class="workout-grid">${WORKOUT_TYPES.map(wt=>`<div class="workout-type-btn ${dwk===wt?"a":""}" onclick="${ic?`sdl('workout_${i}','${wt}')`:""}">${wt}</div>`).join("")}</div>
          </div>
          ${dwk&&dwk!=="😴 Rest Day"?`<div class="daycard-field"><label>Duration (minutes)</label><input class="dur-input" type="number" placeholder="e.g. 45" value="${esc(ddur||"")}" onchange="sdl('duration_${i}',this.value)" ${ic?"":"disabled"} min="1" max="300"></div>`:""}
          <div class="sec-divider">🥗 Meals</div>
          <div class="daycard-field">
            <label>What did you eat?</label>
            <input class="meal-inp" placeholder="🌅 Breakfast..." value="${esc(dl['meal1_'+i]||'')}" onblur="sdl('meal1_${i}',this.value)" ${ic?"":"disabled"}>
            <input class="meal-inp" placeholder="☀️ Lunch..." value="${esc(dl['meal2_'+i]||'')}" onblur="sdl('meal2_${i}',this.value)" ${ic?"":"disabled"}>

          <div class="sec-divider">🧠 Mood & Mental</div>
          <div class="daycard-field">

            </div>
          </div>
          <div class="sec-divider">📝 Journal</div>
          <div class="daycard-field" style="margin-bottom:0">
            <label>Quick Reflection</label>
            <div class="quick-journal">
              <div class="qj-row"><span class="qj-emoji">🙏</span><textarea class="qj-inp" rows="1" placeholder="Grateful for..." onblur="sdl('grat_${i}',this.value)" ${ic?"":"disabled"}>${esc(dl['grat_'+i]||'')}</textarea></div>
              <div class="qj-row"><span class="qj-emoji">😤</span><textarea class="qj-inp" rows="1" placeholder="What stressed me..." onblur="sdl('stress_note_${i}',this.value)" ${ic?"":"disabled"}>${esc(dl['stress_note_'+i]||'')}</textarea></div>

  // ══════ INSIGHTS TAB ══════
  if(S.v==="insights"){
    const wd2=S.wk[CW]||{};
    const dl2=(S.mt[CW]||{}).dl||{};
    const avgSl=avgSleepWeek();const avgSt=avgStressWeek();const avgMd=avgMoodWeek();
    const todayOv=gsCat;
    const sk2=stk();

    // Motivational line
    const motivLine=getMotivLine(go(wd2).p,sk2,avgSl?avgSl.h:null,avgSt);
    h+=`<div class="motiv-card fu">

    h+=`<div class="ins-card fu" style="animation-delay:.08s">

    S.cats.forEach(cat=>{

      h+=`<div class="cat-feedback-row">
        <div class="cat-fb-top">

        <div class="fb-line ${fbClass}">${fbLine||"Log your habits to get feedback"}</div>
      </div>`;
    });
    h+=`</div>`;

    // WEEKLY PATTERNS
    h+=`<div class="ins-card fu" style="animation-delay:.14s">
      <div class="ins-label" style="color:var(--purple)">📊 Weekly Patterns</div>
      <div class="pattern-grid">
        <div class="pattern-box">
          <div class="pi">😴</div>
          <div class="pv" style="color:${avgSl?sleepColor(avgSl.h):"var(--sub)"}">${avgSl?fmtSleep(avgSl):"—"}</div>
          <div class="pl">Avg Sleep</div>
        </div>
        <div class="pattern-box">
          <div class="pi">${avgMd!==null?M[avgMd]:"—"}</div>
          <div class="pv" style="color:${avgMd!==null?(avgMd>=4?"var(--green)":avgMd>=2?"var(--amber)":"var(--red)"):"var(--sub)"}">${avgMd!==null?M[avgMd]:"—"}</div>
          <div class="pl">Avg Mood</div>
        </div>
        <div class="pattern-box">
          <div class="pi">🧠</div>
          <div class="pv" style="color:${avgSt?stressColor(avgSt):"var(--sub)"}">${avgSt?avgSt+"/5":"—"}</div>
          <div class="pl">Avg Stress</div>
        </div>
      </div>`;
    getWeeklyPatternText().forEach(pt=>{
      h+=`<div class="pattern-text">💡 ${pt}</div>`;
    });
    h+=`</div>`;

    // WEEKLY VERDICT
    const{verdict,bestDay,worstDay}=getWeeklyVerdict();
    const ov2=go(wd2);
    h+=`<div class="ins-card fu" style="animation-delay:.2s">
      <div class="ins-label" style="color:var(--amber)">📋 Week Verdict</div>
      <div class="verdict-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:22px;font-weight:900;font-family:'Outfit';color:${scoreColor(ov2.p)}">${ov2.p}%</span>
          <span style="font-size:20px">${scoreEmoji(ov2.p)}</span>
        </div>
        <div class="verdict-text">${verdict}</div>
        ${bestDay.idx>=0?`<div class="verdict-days">
          <div class="verdict-day" style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.15)">
            <div class="vd-label" style="color:var(--green)">Best Day</div>
            <div class="vd-val">${D[bestDay.idx]} · ${bestDay.p}%</div>
          </div>
          <div class="verdict-day" style="background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.12)">
            <div class="vd-label" style="color:var(--red)">Needs Work</div>
            <div class="vd-val">${D[worstDay.idx]} · ${worstDay.p}%</div>
          </div>
        </div>`:""}
      </div>
    </div>`;
  }

  // ══════ HISTORY TAB ══════
  if(S.v==="history"){
    const ws=Object.keys(S.wk).sort().reverse();
    const bw=getBestWeek();
    h+=`<h3 class="fu" style="font-size:15px;font-weight:800;font-family:'Outfit';margin-bottom:14px;color:var(--accent)">📂 All Weeks</h3>`;
    if(!ws.length){h+=`<p style="color:var(--sub);text-align:center;padding:40px 0">No weeks yet — start tracking today!</p>`}
    ws.forEach((w,wi)=>{
      const wo=go(S.wk[w]);const wm=S.mt[w]||{};const wdl=wm.dl||{};
      const cu=w===CW;const isBest=w===bw.week&&bw.pct>0;
      let slTotal=0,slCount=0;
      D.forEach((_,i)=>{const s=calcSleep(wdl["bed_"+i],wdl["wake_"+i]);if(s){slTotal+=s.total;slCount++;}});
      const slStr=slCount?fmtSleep({h:Math.floor(slTotal/slCount/60),m:Math.round((slTotal/slCount)%60)}):"—";
      let stTotal=0,stCount=0;
      D.forEach((_,i)=>{const v=wdl["stress_"+i];if(v!==undefined&&v!==null){stTotal+=Number(v);stCount++;}});
      const stStr=stCount?(Math.round(stTotal/stCount*10)/10)+"/5":"—";
      const mv=D.map((_,i)=>wdl["mood_"+i]).filter(v=>v!==undefined);
      const avgMd=mv.length?Math.round(mv.reduce((a,b)=>a+b,0)/mv.length):null;
      h+=`<div class="hc fu" style="animation-delay:${wi*.05}s;border-left:${cu?"4px solid var(--accent)":isBest?"4px solid var(--amber)":"4px solid transparent"}" onclick="vw('${w}')">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><p style="font-size:13px;font-weight:800">${w}${cu?` <span style="font-size:10px;color:var(--accent)">CURRENT</span>`:""}${isBest?`<span class="best-badge">👑 BEST</span>`:""}</p>
          <p style="font-size:10px;color:var(--sub);margin-top:1px">${wr(w)}</p></div>
          <div style="text-align:right"><span style="font-size:17px;font-weight:900;font-family:'Outfit';color:${scoreColor(wo.p)}">${wo.p}%</span><p style="font-size:9px;color:var(--sub)">${wo.dn}/${wo.tl}</p></div>
        </div>
        <div class="h-mid">
          <div class="h-left">${wm.stars?`<span style="font-size:11px">${"⭐".repeat(wm.stars)}</span>`:""}<span>${avgMd!==null?M[avgMd]:"—"}</span><span style="font-size:10px;color:var(--accent);font-weight:700">😴 ${slStr}</span></div>
          <div class="h-right"><span style="font-size:10px;font-weight:700;color:${stStr!=="—"?stressColor(parseFloat(stStr)):"var(--sub)"}">🧠 ${stStr}</span></div>
        </div>
        <div class="hbs">${S.cats.map(c=>{const s=gs(S.wk[w],c);return`<div class="hbi"><span style="font-size:9px">${c.e}</span>${bh(s.p,c.c,3)}<span style="font-size:9px;color:${c.c};font-weight:700">${s.p}%</span></div>`}).join("")}</div>
      </div>`;
    });
  }

  document.getElementById("app").innerHTML=h;
  save();
  checkConfetti();
}

// ACTIONS
function sv(v){S.v=v;if(v==="tracker"||v==="dailylog"||v==="insights")S.sw=CW;if(v==="dailylog"){openDays={};openDays[getTodayIdx()]=true;}save();R()}
function vw(w){S.sw=w;S.v="tracker";save();R();window.scrollTo(0,0)}
function tt(ci,task,di){if(S.sw!==CW)return;ew(CW);if(!S.wk[CW][ci])S.wk[CW][ci]={};const cat=S.cats.find(c=>c.id===ci);if(!cat)return;if(!S.wk[CW][ci][task])S.wk[CW][ci][task]=Array(cat.d).fill(false);S.wk[CW][ci][task][di]=!S.wk[CW][ci][task][di];save();R()}
function sm(k,v){if(S.sw!==CW)return;if(!S.mt[CW])S.mt[CW]={};S.mt[CW][k]=v;save()}
function sdl(k,v){if(S.sw!==CW)return;ew(CW);S.mt[CW].dl[k]=v;save();if(k.startsWith("bed_")||k.startsWith("wake_")||k.startsWith("workout_")||k.startsWith("stress_"))R()}
function togD(i){openDays[i]=!openDays[i];R()}
function toggleWeek(catId){weekOpen[catId]=!weekOpen[catId];R()}
function updateStressUI(i,v){
  const lb=document.getElementById("stlb_"+i);const sl=document.getElementById("stsl_"+i);
  if(lb){lb.textContent=v;lb.style.color=stressColor(v)}
  if(sl){const pct=(v-1)*25;sl.style.background="linear-gradient(to right,"+stressColor(v)+" "+pct+"%,rgba(255,255,255,0.1) "+pct+"%)"}
  const labelEl=sl&&sl.parentElement&&sl.parentElement.previousElementSibling;
  if(labelEl)labelEl.textContent="Stress Level — "+STRESS_LABELS[v];
}

// RESET
function rw(){
  var m=document.createElement("div");m.id="resetModal";
  m.style.cssText="position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px";
  m.innerHTML='<div style="background:#112240;border:1px solid rgba(100,255,218,0.15);border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center"><p style="font-size:16px;font-weight:800;font-family:Outfit;margin-bottom:12px;color:#e2e8f0">🔄 Reset Week?</p><p style="font-size:12px;color:#8892b0;margin-bottom:20px;line-height:1.6">All habits, logs, sleep and journal for this week will be cleared.<br><br><strong style="color:#ef4444">Cannot be undone.</strong></p><div style="display:flex;gap:10px"><button onclick="cancelReset()" style="flex:1;padding:10px;border-radius:10px;border:1px solid rgba(100,255,218,0.08);background:transparent;color:#8892b0;font-weight:700;font-family:Nunito;cursor:pointer;font-size:13px">Cancel</button><button onclick="doReset()" style="flex:1;padding:10px;border-radius:10px;border:none;background:#ef4444;color:#fff;font-weight:700;font-family:Nunito;cursor:pointer;font-size:13px">Yes, Reset</button></div></div>';
  document.body.appendChild(m);
}
function cancelReset(){var m=document.getElementById("resetModal");if(m)m.remove()}
function doReset(){
  var m=document.getElementById("resetModal");if(m)m.remove();
  var nw={};S.cats.forEach(c=>{nw[c.id]={};c.t.forEach(t=>{nw[c.id][t]=Array(c.d).fill(false)})});
  S.wk[CW]=nw;S.mt[CW]={dl:{}};S.sw=CW;S.v="tracker";openDays={};weekOpen={};confettiShown[CW]=false;
  save();R();window.scrollTo(0,0);setTimeout(()=>showToast("✅ Week reset"),200);
}

      <input style="background:transparent;border:1px solid var(--border);border-radius:7px;padding:4px 8px;color:${cat.c};font-size:14px;font-weight:800;font-family:'Nunito';width:150px" value="${esc(cat.l)}" onchange="uC(${ci},'l',this.value)">
    </div><button style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:15px" onclick="rC(${ci})">🗑️</button></div>`;
    h+=`<div style="display:flex;gap:6px;margin-bottom:10px;align-items:center"><span style="font-size:11px;color:var(--sub);font-weight:600">Days:</span>${[5,6,7].map(d=>`<button class="db" style="border-color:${cat.d===d?cat.c:"var(--border)"};background:${cat.d===d?cat.c+"22":"transparent"};color:${cat.d===d?cat.c:"var(--sub)"}" onclick="uC(${ci},'d',${d})">${d}</button>`).join("")}
    <span style="font-size:11px;color:var(--sub);font-weight:600;margin-left:8px">Color:</span><div style="display:flex;gap:5px;margin-left:4px">${COLORS.map(c=>`<div class="clr-dot ${cat.c===c?"a":""}" style="background:${c}" onclick="uC(${ci},'c','${c}')"></div>`).join("")}</div></div>`;
    cat.t.forEach((t,ti)=>{h+=`<div class="ti"><span class="nm">${esc(t)}</span><button class="tdl" onclick="rT(${ci},${ti})">✕</button></div>`});
    h+=`<div class="ar"><input class="inp" id="nt${ci}" placeholder="Add a habit..." style="font-size:11px;padding:5px 8px" onkeydown="if(event.key==='Enter')aT(${ci})"><button style="background:${cat.c}22;border:1px solid ${cat.c}44;color:${cat.c};padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Nunito'" onclick="aT(${ci})">+ Add</button></div></div>`;
  });
  h+=`<div class="ar" style="margin-top:10px"><input class="inp" id="ncat" placeholder="New category name..." style="font-size:12px"><button style="background:var(--accent);border:none;color:#0a192f;padding:8px 16px;border-radius:8px;font-weight:700;font-family:'Nunito';cursor:pointer" onclick="aC()">+ Category</button></div>`;
  h+=`<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
    <p style="font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">⚠️ Danger Zone</p>
    <button onclick="cS();rw()" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.06);color:#ef4444;font-weight:700;font-family:'Nunito';cursor:pointer;font-size:13px">🔄 Reset Current Week</button>
  </div>`;
  h+=`<button class="svb" onclick="cS()">Save & Close</button></div>`;
  el.innerHTML=h;document.body.appendChild(el);
}
function cS(){const m=document.getElementById("smod");if(m)m.remove();R()}
function uC(i,k,v){if(k==="d")v=+v;S.cats[i][k]=v;save();cS();sS()}
function rC(i){
  var m=document.createElement("div");m.id="resetModal";
  m.style.cssText="position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px";
  m.innerHTML=`<div style="background:#112240;border:1px solid rgba(100,255,218,0.15);border-radius:16px;padding:24px;max-width:300px;width:100%;text-align:center"><p style="font-size:15px;font-weight:800;font-family:Outfit;margin-bottom:16px;color:#e2e8f0">Delete category?</p><div style="display:flex;gap:10px"><button onclick="cancelReset()" style="flex:1;padding:10px;border-radius:10px;border:1px solid rgba(100,255,218,0.08);background:transparent;color:#8892b0;font-weight:700;font-family:Nunito;cursor:pointer;font-size:13px">Cancel</button><button onclick="doRC(${i})" style="flex:1;padding:10px;border-radius:10px;border:none;background:#ef4444;color:#fff;font-weight:700;font-family:Nunito;cursor:pointer;font-size:13px">Delete</button></div></div>`;
  document.body.appendChild(m);
}
function doRC(i){cancelReset();S.cats.splice(i,1);save();cS();sS()}
function rT(ci,ti){S.cats[ci].t.splice(ti,1);save();cS();sS()}
function aT(ci){const inp=document.getElementById("nt"+ci);if(!inp||!inp.value.trim())return;S.cats[ci].t.push(inp.value.trim());save();cS();sS()}
function aC(){const inp=document.getElementById("ncat");if(!inp||!inp.value.trim())return;S.cats.push({id:"c_"+Date.now(),l:inp.value.trim(),e:"📌",d:7,c:"#6366f1",t:[]});save();cS();sS()}

R();
</script>
</body>
</html>
